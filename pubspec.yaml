name: ptms
description: Property & Tenant Management System (local-first, single owner).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: any
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ^8.1.0
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/